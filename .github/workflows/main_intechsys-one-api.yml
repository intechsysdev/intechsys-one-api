# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - Intechsys-one-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.x'
  SOLUTION: 'One.slnx'
  API_PROJECT: 'src/One.Api/One.Api.csproj'
  MIGRATIONS_PROJECT: 'src/One.Infrastructure/One.Infrastructure.csproj'
  AZURE_WEBAPP_NAME: 'Intechsys-one-api'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build with dotnet
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: dotnet publish
        # Se publica el proyecto web, no la solución: así el artefacto contiene
        # únicamente el host y no una carpeta por cada librería.
        run: dotnet publish ${{ env.API_PROJECT }} -c Release --no-build -o ${{ runner.temp }}/myapp

      - name: Generar script idempotente de migraciones
        continue-on-error: true
        # Respaldo auditable del esquema. El API aplica las migraciones al arrancar
        # (DbSeeder.RunAsync), por lo que este script solo se usa si hay que
        # actualizar la base a mano desde el portal de Azure SQL.
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.12
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations script \
            --idempotent \
            --project ${{ env.MIGRATIONS_PROJECT }} \
            --startup-project ${{ env.API_PROJECT }} \
            --configuration Release \
            --no-build \
            --output ${{ runner.temp }}/migrations/one-migrations.sql

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/myapp

      - name: Upload migrations script
        uses: actions/upload-artifact@v4
        with:
          name: migrations-script
          path: ${{ runner.temp }}/migrations/one-migrations.sql
          if-no-files-found: warn

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5265A60E31ED4E14AC0BE3A410246FEC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DDE5FC2836F64C10BEE5DFFC5DADD26A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F07E99EFEC7A4C41931058D64BBF837A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          slot-name: 'Production'
          package: ./publish

      - name: Fijar comando de arranque y reiniciar
        # El contenedor Linux estaba sirviendo la app por defecto (hostingstart) en vez
        # de la nuestra. Con el comando explícito no depende de la autodetección de Oryx.
        run: |
          set -e
          APP='${{ env.AZURE_WEBAPP_NAME }}'
          RG=$(az webapp list --query "[?name=='$APP'].resourceGroup | [0]" -o tsv)
          az webapp config set -n "$APP" -g "$RG" --startup-file 'dotnet One.Api.dll' -o none
          az webapp restart -n "$APP" -g "$RG" -o none

      - name: Diagnóstico del App Service
        if: always()
        # Publica la configuración real del sitio como anotaciones del run: así queda
        # visible en el resumen del workflow sin tener que abrir el portal de Azure.
        run: |
          set +e
          APP='${{ env.AZURE_WEBAPP_NAME }}'
          RG=$(az webapp list --query "[?name=='$APP'].resourceGroup | [0]" -o tsv)
          echo "::warning title=RG::$APP en grupo '$RG'"

          CFG=$(az webapp show -n "$APP" -g "$RG" \
            --query "{kind:kind, state:state, stack:siteConfig.linuxFxVersion, net:siteConfig.netFrameworkVersion, cmd:siteConfig.appCommandLine, alwaysOn:siteConfig.alwaysOn}" \
            -o json | tr -d '\n')
          echo "::warning title=SiteConfig::$CFG"

          NAMES=$(az webapp config appsettings list -n "$APP" -g "$RG" --query "[].name" -o json | tr -d '\n')
          echo "::warning title=AppSettings::$NAMES"

          CONN=$(az webapp config connection-string list -n "$APP" -g "$RG" --query "[].name" -o json | tr -d '\n')
          echo "::warning title=ConnectionStrings::$CONN"

          # Contenido real de /home/site/wwwroot vía Kudu: si One.Api.dll no está en la
          # raíz, el paquete aterrizó en una subcarpeta y el arranque nunca lo encuentra.
          SCM=$(az webapp show -n "$APP" -g "$RG" --query "hostNames[?contains(@,'scm')] | [0]" -o tsv)
          TOKEN=$(az account get-access-token --query accessToken -o tsv)
          FILES=$(curl -s --max-time 40 -H "Authorization: Bearer $TOKEN" "https://$SCM/api/vfs/site/wwwroot/" \
            | python3 -c "import json,sys;print(', '.join(sorted(e['name'] for e in json.load(sys.stdin))[:40]))" 2>/dev/null)
          echo "::warning title=wwwroot::${FILES:-no se pudo listar (¿SCM restringido?)}"

          az webapp log download -n "$APP" -g "$RG" --log-file /tmp/logs.zip >/dev/null 2>&1
          if [ -f /tmp/logs.zip ]; then
            mkdir -p /tmp/logs && unzip -o -q /tmp/logs.zip -d /tmp/logs
            find /tmp/logs -type f \( -name '*.log' -o -name '*.txt' \) -exec tail -n 30 {} + 2>/dev/null \
              | tail -n 50 | while IFS= read -r line; do
                  printf '::warning title=ContainerLog::%s\n' "$(printf '%s' "$line" | tr -d '\r' | cut -c1-350)"
                done
          else
            echo "::warning title=ContainerLog::No se pudieron descargar los logs; revisa que el logging de aplicación esté encendido."
          fi
          exit 0

      - name: Verificar health check
        # El arranque aplica las migraciones; si fallan, el health check no responde
        # y el despliegue queda marcado en rojo en vez de pasar en silencio.
        run: |
          url="${{ steps.deploy-to-webapp.outputs.webapp-url }}/health"
          for attempt in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url" || true)
            echo "Intento $attempt → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 15
          done
          echo "::error::El API no respondió 200 en /health tras el despliegue."
          exit 1
